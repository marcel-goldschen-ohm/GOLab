[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project]
name = "golab"
description = "Goldschen-Ohm lab software"
dynamic = ["version"]
authors = [
    {name = "Marcel Goldschen-Ohm", email = "goldschen-ohm@utexas.edu"},
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel",
    "numpy",
    "pandas",
    "xarray",
    "pint",
    "zarr",
    "scipy",
    "matplotlib",
    "lmfit>=1.2.2",
    "qtpy>=2.4.1",
    "qtawesome>=1.4.0",
    "qtconsole>=5.5.2",
    "pyqtgraph>=0.13.3",
    "pyqt-ext>=2025.4.9.2",
    "pyqtgraph-ext>=2025.4.9"
    "xarray-treeview>=2025.4.9.2"
]
readme = "README.md"
keywords = ["Goldschen-Ohm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]


[project.urls]
homepage = "https://github.com/marcel-goldschen-ohm/GOLab"
repository = "https://github.com/marcel-goldschen-ohm/GOLab"
issues = "https://github.com/marcel-goldschen-ohm/GOLab/issues"


[project.scripts]
golabchart = "golab.golabchart.__main__:main"


[tool.pdm]
distribution = true


[tool.pdm.version]
source = "scm"
